<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceAI - Acceso Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div id="alertPlaceholder"></div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">FinanceAI</h2>
                        <p class="text-muted">Tu asistente inteligente de salud financiera</p>
                    </div>

                    <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-semibold" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab" aria-controls="login-pane" aria-selected="true">Iniciar Sesión</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-semibold" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-pane" type="button" role="tab" aria-controls="register-pane" aria-selected="false">Registrarse</button>
                        </li>
                    </ul>

                    <div class="tab-content" id="authTabsContent">

                        <div class="tab-pane fade show active" id="login-pane" role="tabpanel" aria-labelledby="login-tab" tabindex="0">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="loginEmail" required placeholder="nombre@ejemplo.com">
                                </div>
                                <div class="mb-4">
                                    <label for="loginPassword" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="loginPassword" required placeholder="********">
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Ingresar al Dashboard</button>
                            </form>
                        </div>

                        <div class="tab-pane fade" id="register-pane" role="tabpanel" aria-labelledby="register-tab" tabindex="0">
                            <form id="registerForm">
                                <h6 class="text-muted mb-3 border-bottom pb-2">Credenciales de Acceso</h6>
                                <div class="row g-3 mb-3">
                                    <div class="col-12">
                                        <label for="regEmail" class="form-label">Correo Electrónico</label>
                                        <input type="email" class="form-control" id="regEmail" required>
                                    </div>
                                    <div class="col-12">
                                        <label for="regPassword" class="form-label">Contraseña</label>
                                        <input type="password" class="form-control" id="regPassword" required>
                                    </div>
                                </div>

                                <h6 class="text-muted mb-3 mt-4 border-bottom pb-2">Perfil Financiero Inicial</h6>
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label for="regEdad" class="form-label">Edad</label>
                                        <input type="number" class="form-control" id="regEdad" min="18" max="100" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="regSexo" class="form-label">Sexo</label>
                                        <select class="form-select" id="regSexo" required>
                                            <option value="" selected disabled>Seleccionar...</option>
                                            <option value="M">Masculino</option>
                                            <option value="F">Femenino</option>
                                            <option value="O">Otro</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="regEstadoCivil" class="form-label">Estado Civil</label>
                                        <select class="form-select" id="regEstadoCivil" required>
                                            <option value="" selected disabled>Seleccionar...</option>
                                            <option value="SOLTERO">Soltero/a</option>
                                            <option value="CASADO">Casado/a</option>
                                            <option value="DIVORCIADO">Divorciado/a</option>
                                            <option value="VIUDO">Viudo/a</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="regHijos" class="form-label">Número de Hijos</label>
                                        <input type="number" class="form-control" id="regHijos" min="0" value="0" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="regIngreso" class="form-label">Ingreso Mensual (USD)</label>
                                        <input type="number" class="form-control" id="regIngreso" step="0.01" min="0" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label for="regCredito" class="form-label">Línea de Crédito Total</label>
                                        <input type="number" class="form-control" id="regCredito" step="0.01" min="0" value="0" required>
                                    </div>
                                    <div class="col-12 mt-3">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="regEmpleoFormal" checked>
                                            <label class="form-check-label" for="regEmpleoFormal">
                                                Tengo empleo formal actualmente
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Crear Cuenta</button>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
</body>
</html>
