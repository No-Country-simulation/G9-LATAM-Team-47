<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceAI · Nueva transacción</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="app-container">

    {% include '_sidebar.html' %}

    <main class="main-content">

        <header class="top-header">
            <div>
                <h2 style="margin:0; font-size:1.25rem;">
                    💳 Nueva transacción
                </h2>

                <p style="color:#64748B; font-size:0.85rem; margin:2px 0 0 0;">
                    Registra un nuevo movimiento financiero
                </p>
            </div>
        </header>

        <div class="card p-4 mx-auto form-card">

            <h1 class="h3">Nueva transacción</h1>

            <form method="post">

                <div class="mb-3">
                    <label class="form-label">Comercio</label>

                    <input
                        class="form-control"
                        name="nombre_comercio"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Monto</label>

                    <input
                        class="form-control"
                        type="number"
                        min="0.01"
                        step="0.01"
                        name="monto_transaccion"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Medio de pago</label>

                    <select
                        class="form-select"
                        name="medio_pago">

                        {% for x in ['EFECTIVO','DEBITO','CREDITO','TRANSFERENCIA'] %}
                            <option value="{{ x | lower }}">
                                {{ x }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <button class="btn btn-primary">
                    Guardar
                </button>

            </form>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
