{% extends 'base.html' %}
{% block content %}
<div class="transactions-container">
    <header class="transactions-header">
        <div>
            <h1>💳 Transacciones</h1>
            <p>Historial completo de movimientos</p>
        </div>
        <div class="transactions-filters">
            <select id="transactionPeriodFilter" class="form-select">
                <option value="1">Último mes</option>
                <option value="3">Últimos 3 meses</option>
                <option value="6">Últimos 6 meses</option>
                <option value="12">Último año</option>
                <option value="all">Todo</option>
            </select>
            <select id="filterTxPayment" class="form-select">
                <option value="">Todos los medios de pago</option>
            </select> 
        </div>
    </header>
    <div class="transactions-layout">
        <section class="transaction-chart-panel">
            <div class="card p-3">
                <h3>Resumen por medio de pago</h3>
                <div class="text-center" style="height:300px;">
                    <canvas id="txPieChart"></canvas>
                </div>
            </div>
        </section>

        <section class="transaction-data-panel">
            <div class="transaction-action">
                <button type="button" class="btn btn-primary" onclick="toggleTransactionForm()">
                    + Nueva transacción
                </button>
            </div>

            <div class="transaction-form-panel" id="transactionFormPanel" style="display:none;">

                <div class="card p-3">
                    <h3>Nueva transacción</h3>

                    <form method="post" action="{{ url_for('transacciones.create') }}" >

                        <div class="mb-3">
                            <label class="form-label">Comercio</label>

                            <input class="form-control" name="nombre_comercio" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Monto</label>

                            <input class="form-control" type="number" min="0.01" step="0.01" name="monto_transaccion"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Medio de pago</label>

                            <select class="form-select" name="medio_pago">

                                {% for x in ['EFECTIVO','DEBITO','CREDITO','TRANSFERENCIA'] %}
                                <option value="{{ x | lower }}">
                                    {{ x }}
                                </option>
                                {% endfor %}

                            </select>
                        </div>

                        <button class="btn btn-primary">
                            Guardar
                        </button>

                    </form>
                </div>

            </div>

            <div class="transaction-list-panel">
                <div class="card p-3">
                    {% include 'transacciones/_tabla.html' %}
                </div>
            </div>

        </section>

    </div>

    {% endblock %}
    {% block scripts %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/transacciones.js') }}"></script>
    {% endblock %}
